<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UNITED</title>
<!--
  UNITED — all-in-one build: voice trigger + GPS + RapidSOS wiring + $5/yr monetization + privacy/terms.
  Paste this whole file over index.html in your United_AI repo.

  OWNER SETUP (do once):
  1. Set OWNER_PIN below to a PIN only you know.
  2. Create a $5/year recurring product in Stripe, paste its Payment Link into STRIPE_ANNUAL_LINK.
  3. On YOUR phone: tap the UNITED title 5 times, enter the PIN -> owner panel unlocks on this device only.
  4. Flip "Start annual charge" ON when dispatch is proven live. Leave it OFF while in TEST.

  HONEST LIMITS (read before charging anyone):
  - "I've completed payment" is honor-system. Real proof-of-payment needs Stripe
    webhooks + a tiny backend. Do not treat the local flag as verified revenue.
  - The privacy policy + terms below are templates, not legal advice.
-->
<style>
  :root{--bg:#0a0a0a;--accent:#ff3333;--muted:#888;--card:rgba(255,51,51,0.12)}
  html,body{height:100%}
  body{margin:0;padding:20px;background:var(--bg);color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial;box-sizing:border-box}
  h1{color:var(--accent);text-align:center;margin:0 0 8px;font-size:1.4rem;user-select:none}
  .status{padding:12px;background:var(--card);border-radius:10px;text-align:center;margin:12px 0;min-height:48px;font-size:0.95rem;white-space:pre-wrap}
  .row{display:flex;gap:8px}
  button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}
  .red{background:#ff2222;color:#fff}
  .dark{background:#222;color:#fff}
  .muted{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#fff}
  .gold{background:#b8860b;color:#fff}
  .signature{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:var(--muted);font-size:0.75rem}
  .small{font-size:0.85rem}
  .owner{background:rgba(184,134,11,0.12);border:1px solid rgba(184,134,11,0.5);border-radius:10px;padding:12px;margin:12px 0}
  label.switch{display:flex;align-items:center;gap:8px}
  .legalinks{text-align:center;margin:16px 0 40px;font-size:0.8rem;color:var(--muted)}
  .legalinks a{color:var(--muted);margin:0 8px;cursor:pointer;text-decoration:underline}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:50;padding:20px;box-sizing:border-box}
  .modal .sheet{background:#141414;border-radius:12px;max-width:640px;margin:20px auto;padding:20px;max-height:80vh;overflow:auto;font-size:0.85rem;line-height:1.5}
  .modal h2{color:var(--accent);font-size:1.1rem;margin-top:0}
  .modal button{margin-top:12px}
  input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#111;color:#fff}
</style>
</head>
<body>
  <h1 id="appTitle">UNITED</h1>
  <div id="status" class="status">Ready. Say "Stay Calm" or tap EMERGENCY</div>

  <div class="row" style="margin-bottom:8px">
    <button id="emBtn" class="red">EMERGENCY</button>
    <button id="listenBtn" class="dark">Start Listening</button>
  </div>

  <div class="row small" style="margin-bottom:8px">
    <button id="enableEmsBtn" class="muted">Enable EMS (phone verify)</button>
    <button id="disableEmsBtn" class="muted" style="display:none">Disable EMS</button>
  </div>

  <div style="margin-bottom:8px" class="small">Device mode: <strong id="modeLabel">TEST</strong></div>

  <div style="margin-bottom:8px" class="small">
    <label class="switch"><input id="confirmEms" type="checkbox"> Confirm SEND to EMS (required for live dispatch)</label>
  </div>

  <!-- OWNER-ONLY PANEL: hidden until title-tapped 5x + PIN -->
  <div id="ownerPanel" class="owner small" style="display:none">
    <strong>Owner controls (this device only)</strong><br><br>
    <label class="switch"><input id="chargeSwitch" type="checkbox"> Start annual charge ($5/year)</label>
    <div id="chargeState" style="margin-top:8px;color:var(--muted)">Charging is OFF — app is free.</div>
  </div>

  <!-- SUBSCRIBER UI: appears only when owner turns charging ON -->
  <div id="subPanel" class="small" style="display:none;margin-bottom:8px">
    <div class="row">
      <button id="subBtn" class="gold">Subscribe — $5/year</button>
    </div>
    <div id="subState" style="margin-top:8px;color:var(--muted)"></div>
  </div>

  <div class="legalinks"><a id="privacyLink">Privacy Policy</a><a id="termsLink">Terms of Service</a></div>

  <div class="signature">Built by Edward "The WOLF" Parkinson</div>

  <!-- LEGAL MODAL -->
  <div id="legalModal" class="modal">
    <div class="sheet">
      <h2 id="legalTitle"></h2>
      <div id="legalBody"></div>
      <button id="legalClose" class="dark">Close</button>
    </div>
  </div>

<script>
(() => {
  // ============ CONFIG ============
  const TEST_RELAY_ENDPOINT = 'https://forget-optional-interests-females.trycloudflare.com'; // trycloudflare URLs EXPIRE — use a permanent relay
  const TEST_RELAY_TOKEN = crypto.randomUUID();
  const TEST_PHONE = '+17133801196'; // add your number only when testing SMS

  // ---- RAPIDSOS (fill in after partnership onboarding) ----
  const RAPIDSOS_API_URL = '';
  const RAPIDSOS_TOKEN   = '';
  const EMS_ENDPOINT = RAPIDSOS_API_URL;
  const EMS_AUTH_TOKEN = RAPIDSOS_TOKEN;

  // ---- MONETIZATION ----
  const STRIPE_ANNUAL_LINK = 'https://buy.stripe.com/00w4gz9co3U2357bJGfAc01';   // paste your Stripe $5/year Payment Link here
  const PRICE_LABEL = '$5/year';
  const OWNER_PIN = '1196';        // CHANGE THIS to a PIN only you know
  // --------------------------------

  // constants
  const UNIVERSAL_CODE = 'UNITED-EMS-ALERT-001';
  const TEST_SMS_MESSAGE = 'UNITED TEST ALERT — DO NOT DISPATCH EMS';
  const EMS_ENABLED_KEY = 'united_ems_enabled_v1';
  const OWNER_KEY  = 'united_owner_v1';       // this device is the owner's
  const CHARGE_KEY = 'united_charge_on_v1';  // owner flipped "start annual charge"
  const SUB_KEY    = 'united_sub_v1';        // this device paid (honor-system; see header)

  // state
  let isActive = false, mediaStream = null, recorder = null, calmInterval = null, recognition = null;
  let chunks = [];
  let wantListening = false;
  let lastFix = null;
  let titleTaps = 0, titleTapTimer = null;

  // DOM helpers
  const $ = id => document.getElementById(id);
  const setStatus = (txt, html = false) => { const el = $('status'); if (html) el.innerHTML = txt; else el.textContent = txt; };
  const setModeLabel = () => { $('modeLabel').textContent = isEmsEnabledLocally() ? 'EMS (LIVE)' : 'TEST'; };
  const isOwner = () => localStorage.getItem(OWNER_KEY) === '1';
  const isChargeOn = () => localStorage.getItem(CHARGE_KEY) === '1';
  const isSubscribed = () => localStorage.getItem(SUB_KEY) === '1';

  // storage
  function isEmsEnabledLocally() { return localStorage.getItem(EMS_ENABLED_KEY) === '1'; }
  function setEmsEnabledLocally(v) { if (v) localStorage.setItem(EMS_ENABLED_KEY, '1'); else localStorage.removeItem(EMS_ENABLED_KEY); updateEmsButtons(); }

  function updateEmsButtons() {
    const en = $('enableEmsBtn'); const dis = $('disableEmsBtn');
    if (isEmsEnabledLocally()) { en.style.display = 'none'; dis.style.display = ''; } else { en.style.display = ''; dis.style.display = 'none'; }
    setModeLabel();
  }

  // ---------- OWNER: device-only unlock (tap title 5x + PIN) ----------
  function initOwnerUnlock() {
    $('appTitle').addEventListener('click', () => {
      titleTaps++;
      clearTimeout(titleTapTimer);
      titleTapTimer = setTimeout(() => { titleTaps = 0; }, 3000);
      if (titleTaps >= 5) {
        titleTaps = 0;
        if (isOwner()) { $('ownerPanel').style.display = ''; return; }
        const pin = prompt('Owner PIN:');
        if (pin === OWNER_PIN) {
          localStorage.setItem(OWNER_KEY, '1');
          $('ownerPanel').style.display = '';
          syncChargeUI();
          alert('Owner mode unlocked on this device.');
        } else if (pin !== null) alert('Wrong PIN.');
      }
    });
    if (isOwner()) $('ownerPanel').style.display = '';
    $('chargeSwitch').checked = isChargeOn();
    $('chargeSwitch').addEventListener('change', e => {
      if (e.target.checked) localStorage.setItem(CHARGE_KEY, '1');
      else localStorage.removeItem(CHARGE_KEY);
      syncChargeUI();
    });
  }

  function syncChargeUI() {
    const on = isChargeOn();
    $('chargeSwitch').checked = on;
    $('chargeState').textContent = on
      ? 'Charging is ON — users see the $5/year subscribe button.'
      : 'Charging is OFF — app is free.';
    $('subPanel').style.display = on ? '' : 'none';
    if (on) {
      if (isSubscribed()) {
        $('subBtn').style.display = 'none';
        $('subState').textContent = 'Subscribed ✓ — UNITED is active for this device.';
      } else {
        $('subBtn').style.display = '';
        $('subState').textContent = '';
      }
    }
  }

  function initSubscribe() {
    $('subBtn').addEventListener('click', () => {
      if (!STRIPE_ANNUAL_LINK) { alert('Subscriptions are not set up yet.'); return; }
      // Honor-system: after Stripe checkout, user confirms here.
      // REAL verification needs Stripe webhooks + backend — see file header.
      if (confirm('You will be taken to secure checkout for ' + PRICE_LABEL + '. Continue?')) {
        window.open(STRIPE_ANNUAL_LINK, '_blank');
        setTimeout(() => {
          if (confirm('Did your ' + PRICE_LABEL + ' payment complete?')) {
            localStorage.setItem(SUB_KEY, '1');
            syncChargeUI();
          }
        }, 2000);
      }
    });
  }

  // ---------- LOCATION ----------
  function warmupGPS() {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(
      p => { lastFix = { lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy, time: new Date().toISOString() }; },
      () => {},
      { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 }
    );
  }

  async function collectLocation() {
    if (lastFix && (Date.now() - new Date(lastFix.time).getTime() < 60000)) return lastFix;
    return new Promise(resolve => {
      if (!navigator.geolocation) return resolve(lastFix);
      navigator.geolocation.getCurrentPosition(
        p => {
          lastFix = { lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy, time: new Date().toISOString() };
          resolve(lastFix);
        },
        () => resolve(lastFix),
        { enableHighAccuracy: true, maximumAge: 60000, timeout: 8000 }
      );
    });
  }

  // ---------- RECORDING ----------
  async function startRecording() {
    if (mediaStream) return;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(mediaStream);
      chunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: chunks[0]?.type || 'audio/webm' });
        if (getIsTestMode()) {
          await sendToTestRelayFormData(blob);
        } else {
          if (!$('confirmEms').checked) { console.warn('EMS send blocked: confirmEms not checked'); return; }
          await sendToEmsFormData(blob);
        }
      };
      recorder.start();
    } catch (err) {
      console.error('getUserMedia error', err);
      setStatus('Microphone access denied or unavailable');
    }
  }

  function stopRecordingAndVoice() {
    isActive = false;
    setStatus('Ready. Say "Stay Calm" or tap EMERGENCY');
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (calmInterval) { clearInterval(calmInterval); calmInterval = null; }
  }

  function startCalmVoice() {
    if (!('speechSynthesis' in window) || calmInterval) return;
    const messages = ["Help is coming. You're not alone.", "Breathe slowly. Stay with me.", "You're doing great. Help is on the way."];
    let i = 0;
    calmInterval = setInterval(() => {
      if (!isActive) return;
      const u = new SpeechSynthesisUtterance(messages[i]);
      u.rate = 0.95; u.lang = navigator.language || 'en-US';
      speechSynthesis.speak(u);
      i = (i + 1) % messages.length;
    }, 15000);
  }

  // ---------- RAPIDSOS payload ----------
  function buildRapidSOSPayload(loc) {
    return {
      source: "UNITED",
      eventCode: UNIVERSAL_CODE,
      timestamp: new Date().toISOString(),
      location: loc ? { latitude: loc.lat, longitude: loc.lon, accuracyMeters: Math.round(loc.accuracy || 0) } : null,
      caller: { note: "Voice-triggered alert. Caller may be unable to speak." },
      requestedService: "EMS"
    };
  }

  // ---------- SENDERS ----------
  async function sendAlertMetadata() {
    const loc = await collectLocation();
    const payload = { code: UNIVERSAL_CODE, timestamp: new Date().toISOString(), location: loc };

    if (getIsTestMode()) {
      if (!TEST_RELAY_ENDPOINT) return console.warn('TEST_RELAY_ENDPOINT not set');
      const body = JSON.stringify({ type: 'metadata', data: payload, to: TEST_PHONE, test: true, message: TEST_SMS_MESSAGE });
      try {
        for (let n = 0; n < 2; n++) {
          await fetch(TEST_RELAY_ENDPOINT + '/receive-alert', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TEST_RELAY_TOKEN }, body, mode: 'cors' });
        }
        console.log('Test metadata sent twice to relay');
      } catch (e) { console.warn('Test relay send failed', e); }
      return;
    }

    if (!EMS_ENDPOINT || !EMS_AUTH_TOKEN) {
      alert('RapidSOS not configured yet — paste your API URL + token in the CONFIG section.');
      return console.warn('RAPIDSOS_API_URL / RAPIDSOS_TOKEN not set');
    }
    if (!$('confirmEms').checked) { alert('To send to live EMS you must check "Confirm SEND to EMS"'); return; }
    try {
      await fetch(EMS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + EMS_AUTH_TOKEN },
        body: JSON.stringify(buildRapidSOSPayload(loc)),
        mode: 'cors'
      });
      console.log('RapidSOS alert sent');
      setStatus('Alert sent to EMS via RapidSOS.\nHelp is on the way.');
    } catch (e) { console.warn('RapidSOS send failed', e); setStatus('Send failed — check connection.'); }
  }

  async function sendToTestRelayFormData(blob) {
    if (!TEST_RELAY_ENDPOINT) return;
    const loc = await collectLocation();
    const form = new FormData();
    form.append('file', blob, 'recording.webm');
    form.append('code', UNIVERSAL_CODE);
    form.append('timestamp', new Date().toISOString());
    form.append('message', TEST_SMS_MESSAGE);
    if (loc) { form.append('latitude', loc.lat); form.append('longitude', loc.lon); }
    try {
      for (let n = 0; n < 2; n++) {
        await fetch(TEST_RELAY_ENDPOINT + '/receive-alert/recording', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TEST_RELAY_TOKEN }, body: form, mode: 'cors' });
      }
      console.log('Test recording sent twice');
    } catch (e) { console.warn('Test recording send failed', e); }
  }

  async function sendToEmsFormData(blob) {
    if (!EMS_ENDPOINT || !EMS_AUTH_TOKEN) return console.warn('RapidSOS not configured');
    if (!$('confirmEms').checked) { alert('To send to live EMS you must check "Confirm SEND to EMS"'); return; }
    const loc = await collectLocation();
    const form = new FormData();
    form.append('file', blob, 'recording.webm');
    form.append('payload', JSON.stringify(buildRapidSOSPayload(loc)));
    try {
      await fetch(EMS_ENDPOINT, { method: 'POST', headers: { 'Authorization': 'Bearer ' + EMS_AUTH_TOKEN }, body: form, mode: 'cors' });
      console.log('RapidSOS recording sent');
    } catch (e) { console.warn('RapidSOS recording send failed', e); }
  }

  function getIsTestMode() { return !isEmsEnabledLocally(); }

  // ---------- ACTIVATE ----------
  async function activateEmergency() {
    if (isActive) return;
    isActive = true;
    setStatus('EMERGENCY MODE ACTIVATED\nRecording discreetly...', false);
    startRecording();
    startCalmVoice();
    await sendAlertMetadata();
  }

  // ---------- VOICE TRIGGER ----------
  function initSpeechRecognition() {
    if (recognition) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    recognition = new SR();
    recognition.continuous = true; recognition.interimResults = false; recognition.lang = navigator.language || 'en-US';
    recognition.onresult = event => {
      const last = event.results[event.results.length - 1];
      const t = (last[0]?.transcript || '').trim().toLowerCase();
      if (t) setStatus(t);
      if (t.includes('stay calm')) activateEmergency();
      if (t.includes('help has arrived')) { stopRecordingAndVoice(); setStatus('Deactivated by EMS response team.'); }
    };
    recognition.onerror = e => {
      console.error('Recognition error', e);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        wantListening = false;
        setStatus('Mic blocked. Tap "Start Listening" to enable voice trigger.');
      }
    };
    recognition.onend = () => { if (wantListening) { try { recognition.start(); } catch (_) {} } };
  }

  function startListening() {
    initSpeechRecognition();
    if (!recognition) { alert('Voice recognition not supported in this browser. Use the EMERGENCY button.'); return; }
    wantListening = true;
    try { recognition.start(); setStatus('Listening... say "Stay Calm"'); }
    catch (e) { setStatus('Listening... say "Stay Calm"'); }
  }

  // ---------- OTP: enable EMS on this device ----------
  async function requestOtp() {
    if (!TEST_RELAY_ENDPOINT) return alert('TEST_RELAY_ENDPOINT not configured');
    if (!TEST_PHONE) return alert('TEST_PHONE not configured');
    try {
      const resp = await fetch(TEST_RELAY_ENDPOINT + '/request-otp', {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TEST_RELAY_TOKEN },
        body: JSON.stringify({ to: TEST_PHONE })
      });
      if (!resp.ok) throw new Error('request-otp failed');
      alert('OTP sent to your phone. Enter it when prompted.');
      await verifyOtpFlow();
    } catch (err) { console.error(err); alert('Could not request OTP. Check test relay.'); }
  }

  async function verifyOtpFlow() {
    const code = prompt('Enter the 6-digit verification code sent to your phone:');
    if (!code) return alert('Verification cancelled.');
    try {
      const resp = await fetch(TEST_RELAY_ENDPOINT + '/verify-otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TEST_RELAY_TOKEN },
        body: JSON.stringify({ to: TEST_PHONE, code }),
        mode: 'cors'
      });
      const json = await resp.json();
      if (resp.ok && json.verified) {
        setEmsEnabledLocally(true);
        alert('Device verified. EMS enabled on this device. Future alerts will go to EMS.');
      } else alert('Verification failed. Try again.');
    } catch (err) { console.error(err); alert('Verification request failed.'); }
  }

  function disableEmsLocally() { setEmsEnabledLocally(false); alert('EMS disabled on this device. Returning to TEST mode.'); }

  // ---------- LEGAL ----------
  const PRIVACY_HTML = `
    <p><strong>UNITED Privacy Policy</strong> (template — not legal advice)</p>
    <p><strong>What we collect:</strong> (1) Microphone audio — only after you trigger an alert ("Stay Calm" or EMERGENCY). (2) GPS location — captured at alert time. (3) Your phone number — only if you verify the device for EMS mode.</p>
    <p><strong>How it's used:</strong> Audio and location are transmitted solely to dispatch your alert — to your test relay in TEST mode, or to emergency services via RapidSOS in LIVE mode. Nothing is used for advertising.</p>
    <p><strong>What we don't do:</strong> We don't sell your data. This build runs no analytics and shows no ads.</p>
    <p><strong>Storage:</strong> Alert recordings are transmitted, not stored by us. App settings stay on your device (localStorage) and can be cleared by clearing site data.</p>
    <p><strong>Questions:</strong> contact the developer via the info on the UNITED site.</p>`;

  const TERMS_HTML = `
    <p><strong>UNITED Terms of Service</strong> (template — not legal advice)</p>
    <p><strong>Subscription:</strong> ${PRICE_LABEL} per year, billed via Stripe. Cancel anytime; access continues until the end of the paid period.</p>
    <p><strong>TEST mode:</strong> Unless EMS mode is enabled and confirmed, alerts are sent only to a test relay. In TEST mode no emergency service is contacted.</p>
    <p><strong>No guarantee:</strong> UNITED is a supplemental tool, NOT a replacement for calling or texting 911. We do not guarantee that any alert is transmitted, received, or acted on, or any response time. Voice triggering depends on your device's speech recognition; location depends on GPS signal.</p>
    <p><strong>Limitation of liability:</strong> To the maximum extent permitted by law, the developer is not liable for any failure to dispatch, delay, or reliance on the app in an emergency. ALWAYS contact 911 directly when you are able.</p>
    <p><strong>Acceptance:</strong> Using UNITED means you accept these terms.</p>`;

  function initLegal() {
    const modal = $('legalModal');
    const open = (title, html) => { $('legalTitle').textContent = title; $('legalBody').innerHTML = html; modal.style.display = 'block'; };
    $('privacyLink').addEventListener('click', () => open('Privacy Policy', PRIVACY_HTML));
    $('termsLink').addEventListener('click', () => open('Terms of Service', TERMS_HTML));
    $('legalClose').addEventListener('click', () => { modal.style.display = 'none'; });
    modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
  }

  // ---------- UI wiring ----------
  $('emBtn').addEventListener('click', activateEmergency);
  $('listenBtn').addEventListener('click', startListening);
  $('enableEmsBtn').addEventListener('click', requestOtp);
  $('disableEmsBtn').addEventListener('click', disableEmsLocally);
  $('emBtn').addEventListener('dblclick', stopRecordingAndVoice);

  // ---------- init ----------
  window.addEventListener('load', () => {
    if (localStorage.getItem(EMS_ENABLED_KEY) === null) setEmsEnabledLocally(false);
    updateEmsButtons();
    initOwnerUnlock();
    initSubscribe();
    initLegal();
    syncChargeUI();
    warmupGPS();
    startListening();
    if (!recognition) setStatus('Ready. Say "Stay Calm" or tap EMERGENCY');
  });

})();
</script>
</body>
</html>
